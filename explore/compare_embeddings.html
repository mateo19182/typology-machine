<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DINOv2 vs DINOv3 · Sign embeddings</title>
<style>body{margin:0;background:#101214;color:#e4dfd5;font:14px system-ui,sans-serif}header,main{padding:24px}h1{font-size:26px;font-weight:500}p,li{line-height:1.6;color:#b7b7b7}a{color:inherit}section{border-top:1px solid #444;padding:20px 0}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.images{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.images a,.query{height:100px;background:#202428;display:flex;align-items:center;justify-content:center}.images img,.query img{max-width:100%;max-height:100px}.query{width:180px}h2{font-size:18px}h3{font-size:15px}.blocked{border:1px solid #9d7045;padding:16px}select{background:#202428;color:inherit;padding:8px;font:inherit}.cluster{border-left:4px solid var(--color);padding:8px;margin:14px 0}@media(max-width:650px){.pair{grid-template-columns:1fr}header,main{padding:16px}}</style>
<header><h1>DINOv2 / DINOv3</h1><p id="summary"></p><div id="status"></div><p>Same crops, same clustering settings. Review which neighbors share the sign's shape, lettering, materials, and layout. Labels are local to each model.</p><a href="comparison.json">Download comparison metadata</a><ul id="caveats"></ul><label>Browse <select id="mode"><option value="neighbors">Nearest neighbors</option><option value="clusters">Cluster galleries</option></select></label></header><main id="results"></main>
<script type="application/json" id="data">__DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
$('summary').textContent=`${data.samples.length} crops · ${data.samples.filter(s=>s.source==='apple').length} Apple / ${data.samples.filter(s=>s.source==='gsv').length} Google · run ${data.run_id}`;
const inputs=document.createElement('details');inputs.append(heading('summary','Prompts and model inputs'));
inputs.append(heading('p','No text prompts were used for either DINO model. Each model received the sign crop as an RGB image. The upstream SAM 3 detector used the prompt “store sign”. No Qwen embeddings were evaluated.'));
for(const [name,m] of Object.entries(data.models)){const p=m.embedding.processor;inputs.append(heading('h3',name));inputs.append(heading('p',`${m.embedding.model} · resize ${JSON.stringify(p.size)}${p.do_center_crop?' · center crop '+JSON.stringify(p.crop_size):''} · ${m.embedding.pooling} · ${m.embedding.dimensions} dimensions`));inputs.append(heading('p',`Clustering: PCA to ${m.parameters.pca_dimensions} dimensions, normalize, k-means with ${m.parameters.k} clusters, ${m.parameters.n_init} initializations, seed ${m.parameters.seed}.`))}
document.querySelector('header').append(inputs);
for(const text of data.caveats){const li=document.createElement('li');li.textContent=text;$('caveats').append(li)}
for(const [name,status] of Object.entries(data.status)){const p=document.createElement('p');p.textContent=name+': '+status.state+(status.reason?' · '+status.reason:'');if(status.state!=='complete')p.className='blocked';$('status').append(p)}
function image(i){const s=data.samples[i],a=document.createElement('a'),img=document.createElement('img');a.href=s.image_url;a.target='_blank';a.rel='noopener';img.src=s.image_url;img.loading='lazy';img.alt=`${s.source} ${s.date||''} ${s.crop_id}`;a.title=img.alt;a.append(img);return a}
function heading(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
function render(){const root=$('results');root.replaceChildren();if($('mode').value==='neighbors'){for(const i of data.queries){const section=document.createElement('section');section.append(heading('h2',`${data.samples[i].source} · ${data.samples[i].date||''}`));const q=image(i);q.className='query';section.append(q);const pair=document.createElement('div');pair.className='pair';for(const name of Object.keys(data.status)){const col=document.createElement('div');col.append(heading('h3',name));const m=data.models[name];if(m){const grid=document.createElement('div');grid.className='images';for(const n of m.neighbors[i])grid.append(image(n));col.append(grid)}else col.append(heading('p','Waiting for model access.'));pair.append(col)}section.append(pair);root.append(section)}}else{const pair=document.createElement('div');pair.className='pair';for(const [name,m] of Object.entries(data.models)){const col=document.createElement('div');col.append(heading('h2',name));for(let label=0;label<m.parameters.k;label++){const members=m.assignments.map((a,i)=>({a,i})).filter(x=>x.a.label===label);if(!members.length)continue;const card=document.createElement('div');card.className='cluster';card.style.setProperty('--color',members[0].a.color);card.append(heading('h3',`Cluster ${label} · ${members.length} crops`));const grid=document.createElement('div');grid.className='images';for(let j=0;j<Math.min(12,members.length);j++)grid.append(image(members[Math.floor(j*members.length/Math.min(12,members.length))].i));card.append(grid);col.append(card)}pair.append(col)}root.append(pair)}}$('mode').onchange=render;render();
</script></html>
