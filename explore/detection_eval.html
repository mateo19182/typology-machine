<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAM detection check</title><style>body{margin:20px;background:#111416;color:#e4dfd5;font:15px system-ui}a{color:#edbb64}button,select{padding:8px;background:#252a2e;color:inherit;border:1px solid #555;font:inherit}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center}p{line-height:1.5;color:#aaa}canvas{display:block;max-width:100%;max-height:75vh;width:auto;height:auto;margin-top:15px;background:#222}#caption{max-width:1000px}</style><h1>SAM detection check</h1><a href="/">Category review</a><p>Same source view, separate prompts, shared image features. Boxes show candidates, not verified categories. Masks remain saved but are not displayed. The combined phrase is an experiment, not a multi-class output.</p><nav><button id="prev">← Previous</button><span id="position"></span><button id="next">Next →</button><label>Prompt <select id="prompt"></select></label><label>Threshold <select id="threshold"><option>0.3</option><option selected>0.5</option><option>0.7</option></select></label></nav><p id="caption"></p><canvas id="canvas"></canvas><script>
const $=id=>document.getElementById(id);let data,current=0,version=0;
async function render(){const ticket=++version,view=data.views[current];if(!view){$('caption').textContent='No views ready yet. Refresh after the detector run.';return}$('position').textContent=`${current+1} / ${data.views.length}`;const r=await fetch(`/detector/${view.id}/result.json`);if(ticket!==version)return;if(!r.ok){$('caption').textContent='This source view is still processing.';$('canvas').width=0;return}const result=await r.json(),prediction=result.predictions[Number($('prompt').value)],threshold=Number($('threshold').value);const image=new Image();image.src=`/detector/${view.id}/image.jpg`;await image.decode();if(ticket!==version)return;const canvas=$('canvas');canvas.width=image.width;canvas.height=image.height;const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0);ctx.strokeStyle='#ffca54';ctx.fillStyle='#ffca54';ctx.lineWidth=2;ctx.font='16px sans-serif';let count=0;prediction.boxes.forEach((b,i)=>{const score=prediction.scores[i];if(score<threshold)return;count++;const [x,y,x1,y1]=b;ctx.strokeRect(x*canvas.width,y*canvas.height,(x1-x)*canvas.width,(y1-y)*canvas.height);ctx.fillText(score.toFixed(2),x*canvas.width,Math.max(16,y*canvas.height-4))});$('caption').textContent=`${view.source} · ${view.date} · ${prediction.prompt} · ${count} candidates. Check for visible objects with no box and boxes around the wrong object.`}
fetch('/detector/manifest.json').then(r=>r.json()).then(d=>{data=d;data.prompts.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p;$('prompt').append(o)});render()}).catch(e=>$('caption').textContent=e.message);$('prev').onclick=()=>{current=(current-1+data.views.length)%data.views.length;render()};$('next').onclick=()=>{current=(current+1)%data.views.length;render()};$('prompt').onchange=render;$('threshold').onchange=render;
</script></html>
