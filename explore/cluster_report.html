<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign clusters · Typology Machine</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#101214;color:#e4dfd5;font:14px system-ui,sans-serif}header{padding:24px;border-bottom:1px solid #343638}h1{margin:0 0 8px;font-size:26px;font-weight:500}p{color:#aaa;max-width:850px;line-height:1.5}a{color:inherit}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select{font:inherit;background:#222629;color:inherit;border:1px solid #575c60;border-radius:4px;padding:8px;cursor:pointer}button[aria-pressed=true]{border-color:#e4dfd5;background:#41474b}main{padding:20px}#plot,#map{width:100%;height:55vh;background:#181b1e;border:1px solid #343638}#plot{display:block}#map[hidden],#plot[hidden]{display:none}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:20px}.card{background:#1c2023;padding:14px;border-top:4px solid var(--color)}.card h2{font-size:16px;margin:0 0 8px}.samples{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.samples a{height:65px;background:#101214;display:grid;place-items:center}.samples img{max-width:100%;max-height:65px}#inspect{min-height:95px;display:flex;align-items:center;gap:16px;margin-top:12px}#inspect img{height:90px;max-width:180px;object-fit:contain}small{color:#aaa}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid white;outline-offset:3px}
</style>
<header><h1>Sign clusters</h1><div id="summary"></div><p>Explore groups of similar-looking signs. Select a group to isolate it, or click a point to inspect its crop. Colors identify groups within this run; they do not describe a sign's actual color.</p><nav><button id="scatter" aria-pressed="true">Appearance</button><button id="geography" aria-pressed="false">Map</button><label>Group <select id="filter"><option value="">All groups</option></select></label><a href="metadata.json">Metadata</a><a href="clusters.geojson">GeoJSON</a></nav></header>
<main><p id="caption"></p><canvas id="plot" aria-label="Two-dimensional PCA projection of sign embeddings"></canvas><div id="map" hidden></div><div id="inspect" aria-live="polite">Select a point, or open a crop below.</div><div id="gallery"></div></main>
<script id="data" type="application/json">__CLUSTER_DATA__</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const data=JSON.parse(document.getElementById('data').textContent), $=id=>document.getElementById(id), groups=new Map(data.clusters.map(c=>[c.id,c]));
const imagePath=a=>'../../../'+a.crop;
$('summary').textContent=`${data.source} · ${data.coverage.assigned_crops.toLocaleString()} of ${data.coverage.total_crops.toLocaleString()} crops · ${data.clusters.filter(c=>c.label!==-1).length} clusters · ${data.embedding.model}`;
for(const c of data.clusters){const o=document.createElement('option');o.value=c.id;o.textContent=`${c.label} · ${c.name} (${c.count})`;$('filter').append(o)}
let selected='',view='scatter',map,layer,screen=[];
const visible=()=>data.assignments.filter(a=>!selected||a.cluster_id===selected);
function inspect(a){const c=groups.get(a.cluster_id),img=document.createElement('img'),text=document.createElement('span'),link=document.createElement('a');img.src=imagePath(a);img.alt=c.name;link.href=img.src;link.target='_blank';link.rel='noopener';link.append(img);text.textContent=`${c.name} · ${a.date||'date unknown'} · ${a.location.kind.replaceAll('_',' ')} · ${a.crop_id}`;$('inspect').replaceChildren(link,text)}
const xs=data.assignments.map(a=>a.xy[0]),ys=data.assignments.map(a=>a.xy[1]);
const extent=arr=>arr.reduce((r,v)=>[Math.min(r[0],v),Math.max(r[1],v)],[Infinity,-Infinity]);
const [xmin,xmax]=extent(xs),[ymin,ymax]=extent(ys);
function draw(){if(view!=='scatter')return;const canvas=$('plot'),w=canvas.clientWidth,h=canvas.clientHeight,dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);screen=[];for(const a of visible()){const x=20+(a.xy[0]-xmin)/(xmax-xmin||1)*(w-40),y=h-20-(a.xy[1]-ymin)/(ymax-ymin||1)*(h-40);ctx.fillStyle=a.color;ctx.globalAlpha=a.label===-1?.35:.8;ctx.beginPath();ctx.arc(x,y,selected?3.5:2.5,0,2*Math.PI);ctx.fill();screen.push({x,y,a})}}
$('plot').onclick=e=>{const b=$('plot').getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;let nearest,dist=144;for(const p of screen){const d=(p.x-x)**2+(p.y-y)**2;if(d<dist){nearest=p.a;dist=d}}if(nearest)inspect(nearest)};
function drawMap(){if(!window.L){$('caption').textContent='Map library unavailable. Appearance and crop galleries still work.';return}if(!map){map=L.map('map',{preferCanvas:true});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map);map.fitBounds(data.assignments.map(a=>[a.location.lat,a.location.lon]))}map.invalidateSize();layer.clearLayers();for(const a of visible())L.circleMarker([a.location.lat,a.location.lon],{radius:4,color:a.color,fillColor:a.color,fillOpacity:.8,weight:a.location.kind==='camera'?0:1}).on('click',()=>inspect(a)).addTo(layer)}
function gallery(){const fragment=document.createDocumentFragment();for(const c of data.clusters){if(selected&&c.id!==selected)continue;const card=document.createElement('section');card.className='card';card.style.setProperty('--color',c.color);const title=document.createElement('h2'),button=document.createElement('button');button.textContent=`${c.label} · ${c.name} · ${c.count}`;button.onclick=()=>{$('filter').value=c.id;change()};title.append(button);card.append(title);const samples=document.createElement('div');samples.className='samples';const members=data.assignments.filter(a=>a.cluster_id===c.id);for(let i=0;i<Math.min(16,members.length);i++){const a=members[Math.floor(i*members.length/Math.min(16,members.length))],link=document.createElement('a'),img=document.createElement('img');link.href=imagePath(a);link.target='_blank';link.rel='noopener';img.src=link.href;img.loading='lazy';img.alt=`${c.name}, ${a.date||'unknown date'}`;link.append(img);samples.append(link)}card.append(samples);const p=document.createElement('p');p.textContent=c.description;card.append(p);fragment.append(card)}$('gallery').replaceChildren(fragment)}
function change(){selected=$('filter').value;gallery();if(view==='scatter')draw();else drawMap()}
function setView(v){view=v;$('plot').hidden=v!=='scatter';$('map').hidden=v!=='map';$('scatter').setAttribute('aria-pressed',String(v==='scatter'));$('geography').setAttribute('aria-pressed',String(v==='map'));$('caption').textContent=v==='scatter'?'PCA projection for browsing. Clusters were computed separately; overlap here does not imply identical signs.':'Map locations use sign positions where available and camera positions otherwise. Click a point to see which. Multiple crops can share a location.';if(v==='scatter')draw();else drawMap()}
$('filter').onchange=change;$('scatter').onclick=()=>setView('scatter');$('geography').onclick=()=>setView('map');new ResizeObserver(draw).observe($('plot'));gallery();setView('scatter');
</script></html>
