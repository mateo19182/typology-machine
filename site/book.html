<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book · Typology Machine</title><link rel="icon" href="favicon.svg?v=2" type="image/svg+xml"><link rel="stylesheet" href="book.css?v=f3ace85678d8"></head>
<body>
<header><a class="mast" href="index.html">Typology Machine</a><nav aria-label="Site"><a href="index.html">Map</a><a href="alphabet.html">Alphabet</a><a href="book.html" aria-current="page">Book</a><a href="graffiti.html">Graffiti</a><a href="method.html">Method</a></nav></header>
<main>
<section class="controls" aria-labelledby="heading">
<h1 id="heading">Book</h1>
<form id="settings">
<label class="wide">Book title<input id="title" value="A Coruña, collected" maxlength="90"></label>
<fieldset class="wide categories"><legend>Categories</legend><details><summary id="category-summary">Loading categories…</summary><div id="category-options" class="choices"></div></details></fieldset>
<label>Words or lettering<input id="query" placeholder="Optional search" maxlength="120"></label>
<label>Confidence<select id="confidence"><option value="0.65">0.65</option><option value="0.75">0.75</option><option value="0.85">0.85</option></select></label>
<label>Image source<select id="source"><option value="">All sources</option><option value="apple">Apple</option><option value="gsv">Google Street View</option></select></label>
<label>Neighbourhood<select id="barrio"><option value="">All neighbourhoods</option></select></label>
<fieldset class="wide dates"><legend>Capture date</legend><div class="date-range"><label>From year<input id="from" type="number" min="1900" max="2100" placeholder="Any"></label><label>To year<input id="to" type="number" min="1900" max="2100" placeholder="Any"></label></div><label class="check"><input id="unknown" type="checkbox" checked> Include images with no capture date</label></fieldset>
<label>Objects per page<select id="density"><option value="6">6 · generous</option><option value="12" selected>12 · balanced</option><option value="20">20 · compact</option></select></label>
<label>Pages<select id="pages"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
<fieldset class="wide caption-controls"><legend>Text under images</legend><div class="choices"><label class="check"><input type="checkbox" data-caption-field="text" checked> Detected lettering</label><label class="check"><input type="checkbox" data-caption-field="category" checked> Category</label><label class="check"><input type="checkbox" data-caption-field="barrio" checked> Neighbourhood</label><label class="check"><input type="checkbox" data-caption-field="date"> Capture date</label><label class="check"><input type="checkbox" data-caption-field="source" checked> Image source</label></div><p class="note">Click a caption to edit it.</p><button id="reset-captions" type="button">Reset custom captions</button></fieldset>
<div class="actions wide"><button id="compose" type="submit" disabled>Compose book</button><button id="shuffle" type="button" disabled>Shuffle</button><button id="print" type="button" disabled>Print / save PDF</button></div>
</form>
<p id="status" role="status" aria-live="polite">Loading collection…</p>
<p class="note">A4. Print or save as PDF.</p>
</section>
<section id="book" aria-label="Book preview"></section>
</main><script src="crop-storage.js"></script><script src="book.js?v=8adcbfa7fe1a"></script>
</body></html>
