<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typology Machine</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root { --bg: #0a0b0d; --tile: #121316; --tile-hi: #1a1b1f; --fg: #d8d3c8; --dim: #6f6b63; --line: #1f2024; --amber: #d79a3a;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace; color-scheme: dark; }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 12px/1.5 var(--mono); display: flex; flex-direction: column }
a { color: inherit }
::selection { background: var(--amber); color: var(--bg) }

header { padding: 14px 16px 10px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); flex: none }
.mast { letter-spacing: .18em; text-transform: uppercase; color: var(--dim); white-space: nowrap }
.mast b { color: var(--fg); font-weight: 400 }
nav a { text-decoration:none; }
nav { display: flex; gap: 14px; flex-wrap: wrap }
nav a, nav button, .detail button, .detail a.btn { font: inherit; background: none; border: 0; color: var(--dim); cursor: pointer; padding: 2px 0; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid transparent }
nav button[aria-pressed="true"], .detail button[aria-pressed="true"] { color: var(--amber); border-bottom-color: var(--amber) }
nav button:hover, .detail button:hover, .detail a.btn:hover { color: var(--fg) }
.cluster-controls { padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; flex-wrap: wrap; align-items: center }
.cluster-controls[hidden] { display: none }
.cluster-controls select { background: var(--tile); color: var(--fg); font: inherit; max-width: 65vw }
nav button:focus-visible, .tile:focus-visible, .detail button:focus-visible, .detail a.btn:focus-visible { outline: 1px solid var(--amber); outline-offset: 2px }

.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 2px; padding: 2px; align-content: start }
.tile { position: relative; aspect-ratio: 1; background: var(--tile); border: 0; padding: 0; cursor: pointer; overflow: hidden; display: grid; place-items: center }
.tile:hover { background: var(--tile-hi) }
.tile img { width: 84%; height: 84%; object-fit: contain; display: block }
.more { height: 1px }

#map { flex: 1; min-height: 0; display: none; background: #0a0b0d }
body[data-view="map"] #map { display: block }
body[data-view="map"] .wall, body[data-view="map"] .more, body[data-view="map"] footer { display: none }
.leaflet-container { font: 10px var(--mono) }
.leaflet-control-attribution { background: rgba(10,11,13,.7) !important; color: var(--dim) }
.leaflet-control-attribution a { color: var(--dim) }
.leaflet-bar a { background: var(--tile); color: var(--fg); border-color: var(--line) }
.pin { background: var(--tile); border: 1px solid rgba(215,154,58,.8); padding: 1px; cursor: pointer; box-shadow: 0 1px 6px rgba(0,0,0,.6) }
.pin img { display: block; height: 100%; width: auto; max-width: none }
.pin.g { border-color: rgba(127,179,213,.8) }
.pin:hover { border-color: var(--fg); z-index: 1000 !important }

.detail { position: fixed; inset: 0; background: rgba(10,11,13,.94); display: none; z-index: 2000; padding: 16px; overflow: auto }
.detail[open] { display: grid; grid-template-rows: auto 1fr auto auto }
.detail .top { display: flex; justify-content: space-between; gap: 16px; align-items: baseline }
.detail figure { margin: 0; display: grid; place-items: center; min-height: 0 }
.detail .pic.is-loading { min-width:240px; min-height:120px; }.detail .pic.is-loading .box { display:none; }
.detail .pic #image-status { position:absolute; inset:0; display:grid; place-items:center; background:#111d; color:#eee; font-size:12px; line-height:1.5; padding:20px; text-align:center; }.detail .pic #image-status:empty { display:none; }
.detail .pic { position: relative; display: inline-block; line-height: 0 }
.detail .pic img { max-width: min(100%, 980px); max-height: 62vh; display: block }
.detail .pic .box { position: absolute; border: 1.5px solid var(--amber); box-shadow: 0 0 0 1px rgba(0,0,0,.5); pointer-events: none; display: none }
.detail[data-full] .pic .box { display: block }
.detail .info { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; padding-top: 12px; border-top: 1px solid var(--line); color: #aaa59b }
.detail .info .t { color: var(--fg); font-size: 16px; min-width: 0; overflow-wrap: anywhere }
.detail .info .meta { display: flex; flex-wrap: wrap; gap: 4px 18px }
.detail .info a { color: var(--amber); text-decoration: none }
.detail .arrows { display: flex; gap: 16px }

footer { padding: 28px 16px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 6px 28px; border-top: 1px solid var(--line); flex: none }
@media (max-width: 520px) { .wall { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)) } }

.object-layers { position: absolute; z-index: 800; right: 14px; top: 76px; width: 295px; max-height: calc(100dvh - 180px); overflow: auto; border: 1px solid #37383c; border-radius: 8px; background: rgba(15,17,20,.96); box-shadow: 0 4px 24px #0006; }
.object-layers summary { cursor: pointer; padding: 12px 14px; color: var(--fg); font-size: 13px; }
.layer-search { display:grid; gap:7px; padding:0 14px 12px; }.layer-search label,.layer-search span { font-size:10px; color:#aaa59b; }.layer-search input { width:100%; padding:8px; border:1px solid #444; border-radius:4px; color:var(--fg); background:var(--bg); font:inherit; }.layer-search button,.snapshot-update button { font:inherit; padding:5px 8px; border:1px solid #555; border-radius:4px; color:var(--amber); background:var(--tile); cursor:pointer; }.snapshot-update { padding:0 14px; }.snapshot-update button { margin-bottom:10px; }.snapshot-update span { font-size:10px; color:#aaa59b; }.snapshot-update button[hidden] { display:none; }
.capture-filter { margin:0 14px 12px; padding:10px; border:1px solid #37383c; border-radius:4px; }.capture-filter legend { color:var(--fg); }.year-values { display:flex; justify-content:space-between; }.year-slider { position:relative; height:30px; }.year-slider::before { content:''; position:absolute; top:14px; left:0; right:0; height:3px; background:#555; }.year-slider input { position:absolute; inset:0; width:100%; margin:0; appearance:none; background:transparent; pointer-events:none; }.year-slider input::-webkit-slider-thumb { appearance:none; pointer-events:auto; width:16px; height:16px; border-radius:50%; background:var(--amber); cursor:pointer; }.year-slider input::-moz-range-thumb { pointer-events:auto; width:16px; height:16px; border:0; border-radius:50%; background:var(--amber); cursor:pointer; }.year-slider input:focus-visible { outline:1px solid var(--amber); outline-offset:4px; }
.layer-heading { display: flex; justify-content: space-between; padding: 0 14px 8px; color: #a8a49b; }
.layer-heading button { color: var(--amber); font: inherit; background: none; border: 0; cursor: pointer; }
.layer-option { display: grid; grid-template-columns: 16px 9px 1fr auto; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer; }
.layer-option:hover { background: #ffffff08; }.layer-option input { margin: 0; accent-color: var(--amber); }.layer-option small { color: #aaa59b; font-size: 10px; }.swatch { width: 8px; height: 8px; border-radius: 50%; }
.object-layers p { color: #a8a49b; font-size: 10px; line-height: 1.6; margin: 10px 14px; }.object-layers #layer-error { color: #eeb785; }.object-layers p:empty { display: none; }
.nearby { display:flex; gap:6px; overflow-x:auto; padding:10px 0; max-width:100%; }.nearby[hidden] { display:none; }.nearby .nearby-item { flex:none; width:72px; height:65px; padding:3px; border:1px solid; border-radius:3px; opacity:.55; }.nearby .nearby-item[aria-pressed="true"] { opacity:1; background:#ffffff18; }.nearby img { width:100%; height:100%; object-fit:contain; }
.observation-canvas { pointer-events: none; }.detail button:disabled { opacity: .3; cursor: default; }
#map-status[hidden] { display:none; }
#map-status { position: absolute; bottom: 24px; left: 12px; z-index: 700; padding: 5px 8px; background: #101216db; color: #ccc6bb; font-size: 10px; pointer-events: none; max-width: calc(100vw - 24px); }
body[data-view="wall"] #map-status { display: none; }body[data-view="wall"] .object-layers { flex: none; position: relative; top: auto; right: auto; width: auto; margin: 10px; max-height: none; }body[data-view="wall"] #layer-options { display: grid; grid-template-columns: repeat(auto-fit,minmax(245px,1fr)); }
@media(max-width:600px){ header .mast { white-space:normal; font-size:10px; letter-spacing:.1em; } .object-layers { top: 90px; right: 8px; width: 250px; max-height: 45dvh; }.detail .top { flex-wrap: wrap; gap: 8px; }.detail .arrows { gap: 12px; flex-wrap: wrap; }.detail .pic img { max-height: 52vh; }.cluster-controls { font-size: 10px; } }
.layer-search select,.downloads select { width:100%; background:var(--bg); color:var(--fg); border:1px solid #444; border-radius:4px; padding:7px; font:inherit; }
.layer-search .inline-control { display:flex; gap:8px; align-items:center; }.inline-control input { width:auto; }
.downloads { display:grid; grid-template-columns:1fr 1fr; gap:8px; }.downloads label,.downloads select,.downloads span { grid-column:1/-1; }.downloads span { color:#aaa59b; font-size:10px; }
.downloads button,.map-results button { font:inherit; color:var(--fg); background:var(--tile); border:1px solid #444; border-radius:4px; padding:6px 8px; cursor:pointer; }button:disabled { opacity:.45; cursor:default; }
select:focus-visible,input:focus-visible,button:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
.map-results { position:absolute; left:12px; bottom:45px; z-index:750; width:min(355px,calc(100vw - 335px)); max-height:40dvh; overflow:auto; border:1px solid #37383c; border-radius:8px; background:#0f1114f5; }
.results-heading { display:flex; align-items:center; gap:8px; padding:10px; position:sticky; top:0; background:#0f1114; z-index:1; }.results-heading span { flex:1; }
.map-thumbnails { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:3px; padding:3px; }.map-thumbnails .tile { border-bottom:2px solid; }.map-thumbnails .tile[aria-pressed="true"] { outline:2px solid var(--amber); outline-offset:-2px; background:#30281c; }
.tile .view-count { position:absolute; right:4px; bottom:4px; background:#111d; color:#ddd; padding:1px 4px; font:10px var(--mono); }
#results-more { margin:8px; }#results-empty { margin:10px; color:#aaa59b; }#results-empty:empty { display:none; }
.map-results.collapsed #map-thumbnails,.map-results.collapsed #results-more,.map-results.collapsed #results-empty { display:none; }
body[data-view="wall"] .map-results { display:none; }
body[data-view="map"] .detail { inset:76px auto auto 12px; width:min(440px,calc(100vw - 340px)); max-height:calc(100dvh - 125px); border:1px solid #555; border-radius:8px; box-shadow:0 8px 40px #0008; background:#101216fa; padding:12px; }
body[data-view="map"] .detail[open] { display:flex; flex-direction:column; gap:8px; }
body[data-view="map"] .detail .top { flex-wrap:wrap; gap:8px; }body[data-view="map"] .detail .pic img { width:auto!important; max-width:100%; max-height:40dvh; }body[data-view="map"] .detail figure { min-height:100px; }
body[data-view="map"] .detail .info { font-size:10px; }.detail .arrows { flex-wrap:wrap; }
#action-status { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); z-index:2500; background:var(--tile); padding:8px 12px; border:1px solid #555; border-radius:5px; }#action-status:empty { display:none; }
@media(max-width:800px){.map-results { left:8px; bottom:40px; width:calc(100vw - 16px); max-height:25dvh; }.map-thumbnails { grid-template-columns:repeat(auto-fill,minmax(85px,1fr)); }.object-layers { max-height:48dvh; }body[data-view="map"] .detail { inset:auto 8px 35px; width:auto; max-height:65dvh; }body[data-view="map"] .detail .pic img { max-height:30dvh; }.results-heading { padding:7px; }body[data-view="map"] .detail .info .t { font-size:13px; }}
</style>
</head>
<body data-view="map">

<header>
  <div class="mast"><b>Typology Machine</b> &nbsp;·&nbsp; A Coruña &nbsp;·&nbsp; <span id="count">—</span></div>
  <nav aria-label="View">
    <button id="v-map" aria-pressed="true">Map</button>
    <button id="v-wall" aria-pressed="false">Wall</button>
    <button id="shuffle">Shuffle</button><button id="share">Share view</button><a href="method.html">Method</a><button id="language" aria-label="Change language">ES</button>
  </nav>
</header>
<div class="cluster-controls" id="cluster-controls" hidden>
  <label><input type="checkbox" id="cluster-colors"> Cluster colors</label>
  <label>Group <select id="cluster-filter"><option value="">All signs</option><option value="unassigned">Not clustered</option></select></label>
  <span id="cluster-coverage"></span>
</div>

<details class="object-layers" id="object-layers" open>
  <summary id="layer-summary">Object layers</summary>
  <label class="group-control" style="display:block;padding:0 14px 12px"><input id="group-duplicates" type="checkbox" checked> Group duplicate observations</label><div class="layer-search"><input id="object-search" aria-label="Search text" type="search" placeholder="Street or shop name…"><button id="focus-results">Show results on map</button></div>
  <div class="layer-search">
    <label for="barrio-filter">Barrio</label><select id="barrio-filter" disabled><option value="">All barrios</option></select>
    <span id="barrio-status" role="status"></span>
    <label for="source-filter">Image source</label><select id="source-filter"><option value="">Both sources</option><option value="apple">Apple Look Around</option><option value="gsv">Google Street View</option></select>
    <label class="inline-control"><input id="area-filter" type="checkbox"> Only this map area</label>
    <button id="reset-filters">Reset filters</button>
  </div>
  <fieldset class="capture-filter"><legend>Capture year</legend><div class="year-values"><output id="year-from-value" for="year-from"></output><output id="year-to-value" for="year-to"></output></div><div class="year-slider"><input id="year-from" type="range" aria-label="Earliest capture year" step="1"><input id="year-to" type="range" aria-label="Latest capture year" step="1"></div><label><input id="date-unknown" type="checkbox" checked> Include unknown dates</label></fieldset>
  <div class="snapshot-update"><button id="snapshot-update" hidden>New data available · Update</button><span id="update-status" role="status"></span></div>
  <div class="layer-heading"><button id="layers-all">Select all</button><button id="layers-none">Clear all</button></div>
  <div id="layer-options"></div>
  <p id="layer-error" role="status"></p>
  <fieldset class="capture-filter downloads"><legend>Download selection</legend>
    <label for="download-format">Format</label><select id="download-format"><option value="csv">CSV</option><option value="geojson">GeoJSON</option><option value="jsonl">JSONL</option></select>
    <button id="download-data" disabled>Download data</button><button id="download-manifest" disabled>Manifest</button>
    <span id="download-summary" role="status"></span>
  </fieldset>
</details>
<div id="map"></div><div id="map-status" hidden></div>
<section id="map-results" class="map-results" aria-label="Objects in map area">
  <div class="results-heading"><span id="results-title">In this area</span><button id="results-clear" hidden>Back to area</button><button id="results-toggle" aria-expanded="true">Hide</button></div>
  <div id="map-thumbnails" class="map-thumbnails"></div>
  <button id="results-more" hidden>Show more</button><p id="results-empty" role="status"></p>
</section>
<div id="action-status" role="status"></div>
<main class="wall" id="wall" aria-label="Objects"></main>
<div class="more" id="more"></div>

<footer>
  <span>Apple Look Around</span>
  <span>Google Street View</span>
  <span>SAM 3</span>
  <span>DINOv2</span>
</footer>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Object details">
  <div class="top">
    <div class="mast" id="d-id"></div>
    <div class="arrows"><button id="full" aria-pressed="false">full image</button><button id="prev">← prev</button><button id="next">next →</button><button id="close">close ✕</button></div>
  </div>
  <figure><div class="pic"><img id="d-img" alt=""><span id="image-status" role="status"></span><div class="box" id="d-box"></div></div></figure>
  <div id="viewpoints" class="nearby" aria-label="Viewpoints of this object" hidden></div><p id="group-text" style="white-space:pre-line" hidden></p><div id="nearby" class="nearby" aria-label="Observations at this location"></div>
  <div class="info">
    <div class="t" id="d-text"></div>
    <div class="meta">
      <span id="d-where"></span>
      <span id="d-date"></span>
      <span id="d-seen"></span>
      <span id="d-cluster"></span><span id="d-ocr"></span>
      <a id="d-map" href="#">map</a>
      <a id="d-link" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="crop-storage.js"></script>
<script src="app.js"></script>
</body>
</html>
