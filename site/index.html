<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typology Machine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root { --bg: #0a0b0d; --tile: #121316; --tile-hi: #1a1b1f; --fg: #d8d3c8; --dim: #6f6b63; --line: #1f2024; --amber: #d79a3a;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace; color-scheme: dark; }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 12px/1.5 var(--mono); display: flex; flex-direction: column }
a { color: inherit }
::selection { background: var(--amber); color: var(--bg) }

header { padding: 14px 16px 10px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); flex: none }
.mast { letter-spacing: .18em; text-transform: uppercase; color: var(--dim); white-space: nowrap }
.mast b { color: var(--fg); font-weight: 400 }
nav { display: flex; gap: 14px; flex-wrap: wrap }
nav button, .detail button, .detail a.btn { font: inherit; background: none; border: 0; color: var(--dim); cursor: pointer; padding: 2px 0; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid transparent }
nav button[aria-pressed="true"], .detail button[aria-pressed="true"] { color: var(--amber); border-bottom-color: var(--amber) }
nav button:hover, .detail button:hover, .detail a.btn:hover { color: var(--fg) }
.cluster-controls { padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; flex-wrap: wrap; align-items: center }
.cluster-controls[hidden] { display: none }
.cluster-controls select { background: var(--tile); color: var(--fg); font: inherit; max-width: 65vw }
nav button:focus-visible, .tile:focus-visible, .detail button:focus-visible, .detail a.btn:focus-visible { outline: 1px solid var(--amber); outline-offset: 2px }

.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 2px; padding: 2px; align-content: start }
.tile { position: relative; aspect-ratio: 1; background: var(--tile); border: 0; padding: 0; cursor: pointer; overflow: hidden; display: grid; place-items: center }
.tile:hover { background: var(--tile-hi) }
.tile img { width: 84%; height: 84%; object-fit: contain; display: block }
.more { height: 1px }

#map { flex: 1; min-height: 0; display: none; background: #0a0b0d }
body[data-view="map"] #map { display: block }
body[data-view="map"] .wall, body[data-view="map"] .more, body[data-view="map"] footer { display: none }
.leaflet-container { font: 10px var(--mono) }
.leaflet-control-attribution { background: rgba(10,11,13,.7) !important; color: var(--dim) }
.leaflet-control-attribution a { color: var(--dim) }
.leaflet-bar a { background: var(--tile); color: var(--fg); border-color: var(--line) }
.pin { background: var(--tile); border: 1px solid rgba(215,154,58,.8); padding: 1px; cursor: pointer; box-shadow: 0 1px 6px rgba(0,0,0,.6) }
.pin img { display: block; height: 100%; width: auto; max-width: none }
.pin.g { border-color: rgba(127,179,213,.8) }
.pin:hover { border-color: var(--fg); z-index: 1000 !important }

.detail { position: fixed; inset: 0; background: rgba(10,11,13,.94); display: none; z-index: 2000; padding: 16px; overflow: auto }
.detail[open] { display: grid; grid-template-rows: auto 1fr auto }
.detail .top { display: flex; justify-content: space-between; gap: 16px; align-items: baseline }
.detail figure { margin: 0; display: grid; place-items: center; min-height: 0 }
.detail .pic { position: relative; display: inline-block; line-height: 0 }
.detail .pic img { max-width: min(100%, 980px); max-height: 62vh; display: block }
.detail .pic .box { position: absolute; border: 1.5px solid var(--amber); box-shadow: 0 0 0 1px rgba(0,0,0,.5); pointer-events: none; display: none }
.detail[data-full] .pic .box { display: block }
.detail .info { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--dim) }
.detail .info .t { color: var(--fg); font-size: 16px; min-width: 0; overflow-wrap: anywhere }
.detail .info .meta { display: flex; flex-wrap: wrap; gap: 4px 18px }
.detail .info a { color: var(--amber); text-decoration: none }
.detail .arrows { display: flex; gap: 16px }

footer { padding: 28px 16px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 6px 28px; border-top: 1px solid var(--line); flex: none }
@media (max-width: 520px) { .wall { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)) } }
</style>
</head>
<body data-view="map">

<header>
  <div class="mast"><b>Typology Machine</b> &nbsp;·&nbsp; A Coruña &nbsp;·&nbsp; <span id="count">—</span></div>
  <nav aria-label="View">
    <button id="v-map" aria-pressed="true">Map</button>
    <button id="v-wall" aria-pressed="false">Wall</button>
    <button id="shuffle">Shuffle</button>
  </nav>
</header>
<div class="cluster-controls" id="cluster-controls" hidden>
  <label><input type="checkbox" id="cluster-colors"> Cluster colors</label>
  <label>Group <select id="cluster-filter"><option value="">All signs</option><option value="unassigned">Not clustered</option></select></label>
  <span id="cluster-coverage"></span>
</div>

<div id="map"></div>
<main class="wall" id="wall" aria-label="Signs"></main>
<div class="more" id="more"></div>

<footer>
  <span>Apple Look Around</span>
  <span>Google Street View</span>
  <span>SAM 3</span>
  <span>DINOv2</span>
</footer>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Sign">
  <div class="top">
    <div class="mast" id="d-id"></div>
    <div class="arrows"><button id="full" aria-pressed="false">full image</button><button id="prev">← prev</button><button id="next">next →</button><button id="close">close ✕</button></div>
  </div>
  <figure><div class="pic"><img id="d-img" alt=""><div class="box" id="d-box"></div></div></figure>
  <div class="info">
    <div class="t" id="d-text"></div>
    <div class="meta">
      <span id="d-where"></span>
      <span id="d-date"></span>
      <span id="d-seen"></span>
      <span id="d-cluster"></span>
      <a id="d-map" href="#">map</a>
      <a id="d-link" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const wall = $('wall');
  const { meta, signs } = await fetch('data.json').then(r => r.json());
  const clusters = new Map((meta.clustering?.clusters || []).map(c => [c.id, c]));
  let colorClusters = false, clusterFilter = '', refreshMap = () => {};
  const matches = s => !clusterFilter || (clusterFilter === 'unassigned' ? !s.cluster_id : s.cluster_id === clusterFilter);
  const signColor = s => colorClusters ? (s.cluster_color || '#55585d') : '#d79a3a';
  if (clusters.size) {
    $('cluster-controls').hidden = false;
    for (const c of clusters.values()) { const o = document.createElement('option'); o.value = c.id; o.textContent = `${c.label} · ${c.name}`; $('cluster-filter').appendChild(o); }
    $('cluster-coverage').textContent = `${signs.filter(s => s.cluster_id).length.toLocaleString()} / ${signs.length.toLocaleString()} signs assigned; gray = not clustered or noise`;
  }
  let order = signs.map((_, i) => i), cur = -1, shown = 0;
  const CHUNK = 300;
  $('count').textContent = `${meta.n.toLocaleString('en')} signs`;

  // ---- wall, rendered in chunks as you scroll
  function tile(idx) {
    const s = signs[idx];
    const b = document.createElement('button');
    b.className = 'tile'; b.dataset.i = idx;
    if (colorClusters) b.style.borderBottom = `3px solid ${signColor(s)}`;
    b.setAttribute('aria-label', s.t || s.b || 'sign');
    b.innerHTML = `<img loading="lazy" src="img/${s.id}.jpg" width="${s.w}" height="${s.h}" alt="">`;
    b.addEventListener('click', () => open(s));
    return b;
  }
  function more() { const end = Math.min(order.length, shown + CHUNK); for (let k = shown; k < end; k++) wall.appendChild(tile(order[k])); shown = end; }
  function render() { wall.innerHTML = ''; shown = 0; more(); }
  new IntersectionObserver(es => { if (es[0].isIntersecting && shown < order.length) more(); }, { rootMargin: '1200px' }).observe($('more'));
  $('shuffle').addEventListener('click', () => { for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } render(); setView('wall'); });
  $('cluster-colors').onchange = () => { colorClusters = $('cluster-colors').checked; render(); refreshMap(); };
  $('cluster-filter').onchange = () => { clusterFilter = $('cluster-filter').value; order = signs.map((_, i) => i).filter(i => matches(signs[i])); $('count').textContent = `${order.length.toLocaleString('en')} signs`; cur = -1; render(); refreshMap(); };

  // ---- map: satellite imagery; dots when far out, the signs themselves once close enough
  const PIN_ZOOM = 17, PIN_H = 36;
  let map = null, dotLayer = null, pinLayer = null;
  function setView(v) {
    document.body.dataset.view = v;
    $('v-map').setAttribute('aria-pressed', String(v === 'map'));
    $('v-wall').setAttribute('aria-pressed', String(v === 'wall'));
    if (v === 'map') { if (!map) buildMap(); else map.invalidateSize(); }
  }
  $('v-map').addEventListener('click', () => setView('map'));
  $('v-wall').addEventListener('click', () => setView('wall'));
  function buildMap() {
    map = L.map('map', { preferCanvas: true, zoomControl: true }).setView([43.3665, -8.4065], 15);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19,
      attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics' }).addTo(map);
    const canvas = L.canvas({ padding: 0.5 });
    const radius = z => z < 13 ? 1.2 : z < 15 ? 2 : 3.5;
    const colour = s => s.src === 'g' ? '#7fb3d5' : '#d79a3a';
    const dots = signs.map(s => L.circleMarker([s.la, s.lo], { renderer: canvas, radius: radius(15), stroke: false, fillColor: colour(s), fillOpacity: 0.9 })
      .on('click', () => map.setView([s.la, s.lo], PIN_ZOOM)));
    dotLayer = L.layerGroup(dots);
    pinLayer = L.layerGroup();
    function refresh() {
      const z = map.getZoom();
      if (z < PIN_ZOOM) {
        if (map.hasLayer(pinLayer)) map.removeLayer(pinLayer);
        if (!map.hasLayer(dotLayer)) dotLayer.addTo(map);
        const r = radius(z); dotLayer.clearLayers(); dots.forEach((d, i) => { d.setRadius(r); d.setStyle({ fillColor: signColor(signs[i]) }); if (matches(signs[i])) dotLayer.addLayer(d); });
        return;
      }
      if (map.hasLayer(dotLayer)) map.removeLayer(dotLayer);
      pinLayer.clearLayers();
      const b = map.getBounds().pad(0.2);
      const h = z >= 19 ? PIN_H * 1.6 : PIN_H;
      for (const s of signs) {
        if (!matches(s)) continue;
        if (!b.contains([s.la, s.lo])) continue;
        const w = Math.round(h * s.w / s.h);
        const icon = L.divIcon({ className: 'pin', html: `<img style="border-bottom:3px solid ${signColor(s)}" src="img/${s.id}.jpg" alt="">`, iconSize: [w + 4, h + 4], iconAnchor: [(w + 4) / 2, (h + 4) / 2] });
        L.marker([s.la, s.lo], { icon, title: s.t || s.b || s.st || '' }).on('click', () => open(s)).addTo(pinLayer);
      }
      if (!map.hasLayer(pinLayer)) pinLayer.addTo(map);
    }
    map.on('zoomend moveend', refresh);
    refreshMap = refresh;
    refresh();
  }

  // ---- detail
  const detail = $('detail');
  let full = false, curSign = null;
  function showPic() {
    const s = curSign, on = full && s.ctx;
    $('d-img').src = on ? `ctx/${s.id}.jpg` : `img/${s.id}.jpg`;
    if (on) { const [x0, y0, x1, y1] = s.bx; Object.assign($('d-box').style, { left: x0 * 100 + '%', top: y0 * 100 + '%', width: (x1 - x0) * 100 + '%', height: (y1 - y0) * 100 + '%' }); detail.dataset.full = '1'; }
    else delete detail.dataset.full;
    $('full').setAttribute('aria-pressed', String(on)); $('full').hidden = !s.ctx;
  }
  $('full').addEventListener('click', () => { full = !full; showPic(); });
  function open(s) {
    cur = order.indexOf(signs.indexOf(s)); curSign = s;
    showPic();
    $('d-text').textContent = s.t || s.b || '';
    $('d-id').textContent = s.id;
    $('d-where').textContent = [s.st, s.ba].filter(Boolean).join(' · ');
    $('d-date').textContent = s.d;
    $('d-seen').textContent = `${s.seen} views`;
    $('d-cluster').textContent = clusters.get(s.cluster_id)?.name || (clusters.size ? 'Not clustered' : '');
    $('d-link').href = s.u; $('d-link').textContent = s.src === 'g' ? 'Street View ↗' : 'Look Around ↗';
    $('d-map').onclick = e => { e.preventDefault(); close(); setView('map'); map.setView([s.la, s.lo], 18); };
    detail.setAttribute('open', ''); $('close').focus();
  }
  function close() { detail.removeAttribute('open'); }
  function step(d) { if (cur < 0) return; open(signs[order[(cur + d + order.length) % order.length]]); }
  $('close').addEventListener('click', close);
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  detail.addEventListener('click', e => { if (e.target === detail) close(); });
  document.addEventListener('keydown', e => {
    if (detail.hasAttribute('open')) { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'f') { full = !full; showPic(); } }
  });

  render();
  setView('map');
})();
</script>
</body>
</html>
